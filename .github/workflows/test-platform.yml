name: Test platform

on:
  workflow_call:
    inputs:
      python-versions:
        required: true
        type: string
      runner:
        required: true
        type: string
      os:
        required: true
        type: string
      target:
        required: true
        type: string

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@64adfd9e935fa438859b9e080fd026720b2ba070

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1
        with:
          workspaces: .
          key: ${{ inputs.os }}-${{ inputs.target }}-${{ matrix.python-version }}

      - name: Cache Luxical model weights
        uses: actions/cache@v4
        with:
          path: .cache/polars-luxical
          key: luxical-one-safetensors-v1
          enableCrossOsArchive: true

      - name: Create venv, build and install extension
        run: uv sync --frozen --group test

      - name: Run Rust unit tests
        if: inputs.os == 'linux'
        env:
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: cargo test --release --no-default-features

      - name: Run tests
        env:
          POLARS_LUXICAL_CACHE_DIR: ${{ github.workspace }}/.cache/polars-luxical
        run: uv run --no-sync --frozen pytest -s -v
